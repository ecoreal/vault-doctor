name: Release

# Obsidian plugin convention: pushing a semver tag (e.g. 1.0.3, v prefix
# tolerated) builds the bundle and publishes a GitHub release with the
# three files the community plugin store expects.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Vault Doctor $GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
